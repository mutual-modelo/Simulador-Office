name: CI - Validación Frontend Simulador-Office

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Validar sintaxis JS embebida en index.html y JSON del padrón
        run: |
          python3 - <<'PY'
          import json, re, subprocess, sys, tempfile

          with open("padron_codigos_descuentos_normalizado.json", encoding="utf-8") as f:
              padron = json.load(f)
          print(f"Padrón JSON válido: {len(padron)} entradas/claves")

          html = open("index.html", encoding="utf-8").read()
          scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
          if not scripts:
              sys.exit("No se encontraron scripts inline en index.html")
          for i, script in enumerate(scripts):
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as tf:
                  tf.write(script)
                  p = tf.name
              res = subprocess.run(["node", "--check", p], capture_output=True, text=True)
              if res.returncode != 0:
                  print(res.stderr)
                  sys.exit(f"Error de sintaxis JS en script inline #{i}")
          print(f"Scripts inline válidos: {len(scripts)}")
          PY
      - name: Instalar dependencias con Bun y verificar build Vite
        run: |
          bun install --frozen-lockfile
          bun run build
