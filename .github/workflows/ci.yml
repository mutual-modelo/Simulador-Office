name: CI - Validación Frontend Simulador-Office

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Validar sintaxis JS embebida en index.html y JSON del padrón
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys, tempfile

          raw_padron = open("padron_codigos_descuentos_normalizado.json", "rb").read()
          padron = json.loads(raw_padron.decode("utf-8"))
          manifest = json.load(open("padron_manifest.json", encoding="utf-8"))
          sha_actual = hashlib.sha256(raw_padron).hexdigest()
          if sha_actual != manifest["sha256"]:
              sys.exit(f"Desfase de padrón JSON: actual={sha_actual} esperado={manifest['sha256']}")
          print(f"Padrón JSON válido y sincronizado: sha256={sha_actual[:12]}... ({len(padron)} claves)")

          for html_name in ("index.html", "firmar.html", "verificar.html"):
              p_html = pathlib.Path(html_name)
              if not p_html.exists():
                  sys.exit(f"Falta archivo HTML esperado: {html_name}")
              html = p_html.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.S | re.I)
              if not scripts:
                  sys.exit(f"No se encontraron scripts inline en {html_name}")
              for i, script in enumerate(scripts):
                  with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as tf:
                      tf.write(script)
                      p = tf.name
                  res = subprocess.run(["node", "--check", p], capture_output=True, text=True)
                  if res.returncode != 0:
                      print(res.stderr)
                      sys.exit(f"Error de sintaxis JS en {html_name} script inline #{i}")

          html_idx = pathlib.Path("index.html").read_text(encoding="utf-8")
          srcs = re.findall(r'<script[^>]*\bsrc=["\']([^"\']+)["\']', html_idx, re.I)
          for extra_js in ("sw.js",):
              if pathlib.Path(extra_js).exists():
                  srcs.append(extra_js)
          for s in srcs:
              if not s.startswith(("http://", "https://", "//")):
                  p_mod = pathlib.Path(s.split("?")[0])
                  if not p_mod.exists():
                      sys.exit(f"Falta archivo JS referenciado en index.html: {p_mod}")
                  res = subprocess.run(["node", "--check", str(p_mod)], capture_output=True, text=True)
                  if res.returncode != 0:
                      print(res.stderr)
                      sys.exit(f"Error de sintaxis JS en {p_mod}")
          print("Scripts inline (index/firmar/verificar) y módulos locales (incl. sw.js) válidos")
          PY
      - name: Instalar dependencias con Bun y verificar build Vite
        run: |
          bun install --frozen-lockfile
          bun run build

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Escanear secretos con Gitleaks
        run: |
          GITLEAKS_VER="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --config .gitleaks.toml
      - name: Auditar dependencias JS (bun audit)
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      - name: Verificar reglas de seguridad estáticas (Code.gs y HTML)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          code_gs = pathlib.Path("Code.gs").read_text(encoding="utf-8")
          if "ANYONE_WITH_LINK" in code_gs:
              sys.exit("Fallo de seguridad: se detectó ANYONE_WITH_LINK en Code.gs")

          objetivos = [
              pathlib.Path("index.html"),
              pathlib.Path("firmar.html"),
              pathlib.Path("verificar.html"),
              pathlib.Path("Code.gs"),
              *sorted(pathlib.Path("js").glob("*.js")),
          ]
          patrones_prohibidos = [
              (r"AIza[0-9A-Za-z_-]{25,}", "Posible API Key de Google expuesta"),
              (r"sb_secret_[0-9A-Za-z_-]{15,}", "Posible Secret Key de Supabase expuesta"),
          ]
          for archivo in objetivos:
              if not archivo.exists():
                  continue
              txt = archivo.read_text(encoding="utf-8", errors="ignore")
              for pat, desc in patrones_prohibidos:
                  if re.search(pat, txt):
                      sys.exit(f"Fallo de seguridad en {archivo}: {desc}")
          print("Chequeo estático de secretos y Drive privado OK")
          PY

